name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  integration:
    name: Integration tests (MySQL 8.4 + demo data)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: aws_inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Write test config
        run: |
          cat > "$RUNNER_TEMP/ci-config.ini" <<'EOF'
          [database]
          host = 127.0.0.1
          port = 3306
          database = aws_inventory_test
          user = root
          password = ci-only-password

          [account:demo]
          profile = demo
          regions = us-east-1
          EOF
      - name: Integration tests
        env:
          AWS_INVENTORY_INTEGRATION: "1"
        run: |
          export AWS_INVENTORY_CONFIG="$RUNNER_TEMP/ci-config.ini"
          pytest tests/test_integration.py -q
